{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center pt-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg p-4 rounded-4 auth-card">
            <div class="card-body">
                <h3 class="card-title text-center fw-bold mb-4">Welcome Back</h3>
                <form method="POST">
                    <div class="mb-4">
                        <label for="email" class="form-label text-muted small fw-semibold">Email Address</label>
                        <input type="email" class="form-control form-control-lg bg-light border-0" id="email" name="email" required placeholder="you@example.com">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-muted small fw-semibold">Password</label>
                        <input type="password" class="form-control form-control-lg bg-light border-0" id="password" name="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-semibold shadow-sm login-btn">Log In</button>
                </form>
                <div class="text-center mt-4">
                    <p class="text-muted small">Don't have an account? <a href="{{ url_for('signup') }}" class="text-primary fw-bold text-decoration-none">Sign up</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
