{% extends 'base.html' %}
{% block content %}
<div class="row my-5">
    <div class="col-md-6 mb-4 mb-md-0 d-flex justify-content-center align-items-center bg-light rounded-4 shadow-sm p-5">
        <img src="{{ url_for('static', filename='images/' + product.image) }}" class="img-fluid mix-blend-multiply" alt="{{ product.name }}" onerror="this.src='https://via.placeholder.com/500?text=No+Image';">
    </div>
    <div class="col-md-6 ps-md-5 d-flex flex-column justify-content-center">
        <span class="badge bg-secondary mb-3 w-auto align-self-start py-2 px-3 fw-normal bg-opacity-10 text-secondary border border-secondary border-opacity-25 rounded-pill">{{ product.category }}</span>
        <h1 class="display-5 fw-bold mb-3 text-dark">{{ product.name }}</h1>
        <p class="fs-4 fw-bold text-primary mb-4">${{ "%.2f"|format(product.price) }}</p>
        <div class="text-muted product-desc-text lh-lg mb-5">
            {{ product.description }}
        </div>
        <form action="{{ url_for('add_to_cart', id=product.id) }}" method="POST">
            <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 py-3 fw-bold shadow-sm d-inline-flex align-items-center gap-2 add-cart-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-cart-plus" viewBox="0 0 16 16">
                  <path d="M9 5.5a.5.5 0 0 0-1 0V7H6.5a.5.5 0 0 0 0 1H8v1.5a.5.5 0 0 0 1 0V8h1.5a.5.5 0 0 0 0-1H9V5.5z"/>
                  <path d="M.5 1a.5.5 0 0 0 0 1h1.11l.401 1.607 1.498 7.985A.5.5 0 0 0 4 12h1a2 2 0 1 0 0 4 2 2 0 0 0 0-4h7a2 2 0 1 0 0 4 2 2 0 0 0 0-4h1a.5.5 0 0 0 .491-.408l1.5-8A.5.5 0 0 0 14.5 3H2.89l-.405-1.621A.5.5 0 0 0 2 1H.5zm3.915 10L3.102 4h10.796l-1.313 7h-8.17zM6 14a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm7 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/>
                </svg>
                Add to Cart
            </button>
        </form>
    </div>
</div>
{% endblock %}
